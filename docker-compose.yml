# Local Grafana for the Garmin dashboard.
#   npm run grafana        start (http://localhost:3000)
#   npm run grafana:stop   stop
#
# Grafana reads the same public/garmin.json the React app uses: the folder is mounted
# read-only into Grafana's static files, and the Infinity data source fetches it from
# http://localhost:3000/public/garmin/garmin.json inside the container.
name: garmin-dashboard

services:
  grafana:
    image: grafana/grafana-oss:12.4.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # only reachable from this computer
    environment:
      # Installed before Grafana starts. Infinity 4.x needs Grafana 12.2.5+ (or 11.6.11+).
      GF_PLUGINS_PREINSTALL_SYNC: yesoreyeram-infinity-datasource
      # Read-only anonymous viewing + embedding, so the React page can show it in an iframe.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/garmin.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./public:/usr/share/grafana/public/garmin:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  grafana-data:
